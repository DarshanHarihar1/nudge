name: Renew Gmail Watch

on:
  schedule:
    # 06:00 IST = 00:30 UTC — watch expires after 7 days; daily leaves 6 days of slack
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger gmail-watch endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          : "${APP_URL:?Repository secret APP_URL is not set}"
          : "${CRON_SECRET:?Repository secret CRON_SECRET is not set}"
          APP_URL="${APP_URL%/}"  # strip trailing slash to avoid a //path 404
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/cron/gmail-watch")
          echo "HTTP $status"
          cat /tmp/body.txt; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::gmail-watch failed with HTTP $status (401 = CRON_SECRET mismatch with the API server)"
            exit 1
          fi
